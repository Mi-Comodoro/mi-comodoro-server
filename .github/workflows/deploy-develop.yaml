name: Deploy Backend NestJS
on:
  push:
    branches: [ develop ]
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Instalar dependencias de desarrollo
        run: pnpm install --frozen-lockfile

      - name: Compilar backend
        run: pnpm build

      # Respaldo antes de tocar el esquema. Mientras se instala y prueba en el servidor (docs/BACKUPS.md)
      # un fallo avisa pero no detiene el despliegue; cuando esté probado, quitar el "|| echo".
      - name: Respaldo previo a las migraciones
        run: |
          env_val() { grep -E "^$1=" /var/www/intranet/mi-comodoro-server/.env | head -1 | cut -d= -f2- | sed 's/[[:space:]]*#.*//' | tr -d '\r'; }
          export DB_HOST="$(env_val DB_HOST)" DB_PORT="$(env_val DB_PORT)" DB_USER="$(env_val DB_USER)" DB_NAME="$(env_val DB_NAME)" DB_PASSWORD="$(env_val DB_PASSWORD)"
          bash scripts/db/backup.sh || echo "::warning::El respaldo previo a las migraciones falló. Revisa docs/BACKUPS.md (instalación en el servidor)."

      - name: Correr migraciones
        run: |
          cp /var/www/intranet/mi-comodoro-server/.env .env
          pnpm migration:run

      - name: Crear carpeta destino
        run: mkdir -p /var/www/intranet/mi-comodoro-server

      - name: Limpiar deploy anterior
        run: |
          rm -rf /var/www/intranet/mi-comodoro-server/dist

      - name: Copiar archivos necesarios
        run: |
          cp -r dist /var/www/intranet/mi-comodoro-server/
          cp package.json /var/www/intranet/mi-comodoro-server/
          cp pnpm-lock.yaml /var/www/intranet/mi-comodoro-server/
          cp pnpm-workspace.yaml /var/www/intranet/mi-comodoro-server/
          cp ecosystem.config.js /var/www/intranet/mi-comodoro-server/

      # --ignore-scripts evita el fallo de Husky (script prepare) en produccion
      - name: Instalar dependencias produccion
        working-directory: /var/www/intranet/mi-comodoro-server
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Reiniciar backend
        run: |
          cd /var/www/intranet/mi-comodoro-server
          pm2 delete mi-comodoro-server || true
          pm2 start ecosystem.config.js
          pm2 save
